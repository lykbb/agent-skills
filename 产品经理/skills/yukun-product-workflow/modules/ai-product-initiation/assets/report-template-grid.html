<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* 瑞士网格：纸色底、黑字、一种红色强调。五级字号；每章只用一到两个色块；装饰由内容生成或完整出现。 */
:root{--paper:#f6f5f1;--ink:#111;--gray:#6b6a65;--light:#d9d7d0;--tint:#ebe8df;--red:#e4322b;--blue:#111;
--f1:128px;--f2:40px;--f3:18px;--f4:15px;--f5:12px;--side:236px;--ease:cubic-bezier(.2,.8,.2,1);
--font:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:32px}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--f4);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.red{color:var(--red)}
.kicker{font-size:var(--f5);font-weight:700;letter-spacing:.08em;color:var(--gray)}
.skip{position:fixed;top:-60px;left:16px;z-index:30;padding:10px 16px;background:var(--red);color:#fff;font-weight:700;text-decoration:none}
.skip:focus{top:12px}

/* ---------- 左侧目录：每章带小节链接 ---------- */
.toc{position:fixed;top:0;bottom:0;left:0;z-index:10;display:flex;flex-direction:column;width:var(--side);padding:36px 28px;overflow-y:auto;border-right:1px solid var(--light);background:var(--paper)}
.brand b{display:block;font-size:var(--f3);font-weight:800;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.brand b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:3px;background:var(--red)}
.brand span{display:block;margin-top:2px;font-size:var(--f5);font-weight:700;color:var(--gray)}
.chapters{margin-top:40px;list-style:none}
.chapters>li{margin-top:2px}
.chapters>li>a{display:grid;grid-template-columns:30px 1fr;padding:6px 0;font-weight:700;color:var(--gray);text-decoration:none;transition:color .2s}
.chapters>li>a i{font-style:normal;font-size:var(--f5);line-height:2}
.chapters>li>a:hover{color:var(--ink)}
.chapters>li.cur>a{color:var(--red)}
.subs{display:none;margin:2px 0 8px 30px;padding-left:12px;list-style:none;border-left:1px solid var(--light)}
.chapters>li.cur .subs{display:block}
.subs a{display:block;padding:3px 0;font-size:var(--f5);color:var(--gray);text-decoration:none}
.subs a.on{color:var(--ink);font-weight:700}
.toc-foot{margin-top:auto;padding-top:20px;font-size:var(--f5);color:var(--gray)}

/* ---------- 正文铺满目录右侧，背景是十二栏辅助线 ---------- */
main{position:relative;isolation:isolate;margin-left:var(--side);padding:0 clamp(32px,4.5vw,72px) 120px}
.inner{position:relative;max-width:1440px;margin:0 auto}
.inner::before{content:"";position:absolute;inset:0;z-index:-2;background-image:linear-gradient(90deg,rgba(17,17,17,.05) 1px,transparent 1px);background-size:calc(100% / 12) 100%;pointer-events:none}
.inner::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;z-index:-2;background:rgba(17,17,17,.05)}
.reg{position:absolute;top:-30px;left:-30px;width:15px;height:15px;pointer-events:none}
.reg::before,.reg::after{content:"";position:absolute;background:var(--ink);opacity:.4}
.reg::before{left:7px;top:0;width:1px;height:15px}
.reg::after{top:7px;left:0;width:15px;height:1px}

/* ---------- 报头 ---------- */
.mast{position:relative;padding:72px 0 24px}
.mast h1{max-width:calc(100% - 180px);font-size:var(--f1);font-weight:800;line-height:.95;letter-spacing:-.045em;overflow-wrap:anywhere}
.mast h1::after{content:"";display:inline-block;width:.16em;height:.16em;margin-left:.04em;background:var(--red)}
.tagline{margin-top:24px;max-width:1100px;font-size:var(--f2);font-weight:800;line-height:1.25;letter-spacing:-.02em}
.mast-row{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;margin-top:36px;align-items:end}
.mast-row p{max-width:720px;font-size:var(--f3);color:var(--gray)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:var(--f5)}
.facts dt{color:var(--gray)}
.facts dd{font-weight:700}
.badge{position:absolute;top:64px;right:0;width:150px;height:150px;color:var(--ink)}
.badge text{font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:2.4px;fill:currentColor}
.badge-dot{fill:var(--red)}

/* ---------- 章节标题：大号编号 + 描边英文背景字 ---------- */
.sec{margin-top:144px}
.sec-head{position:relative;isolation:isolate;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.sec-no{font-size:var(--f1);font-weight:800;line-height:.82;letter-spacing:-.05em;color:var(--red)}
.sec-head h2{margin-top:10px;font-size:var(--f2);font-weight:800;line-height:1.25;letter-spacing:-.02em}
.sec-head .lead{margin-top:16px;max-width:760px;font-size:var(--f3);color:var(--gray)}
.bg-word{position:absolute;z-index:-1;top:-64px;right:0;font-size:clamp(40px,11vw,200px);font-weight:800;line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.2px rgba(228,50,43,.24);white-space:nowrap;pointer-events:none;user-select:none}

/* ---------- 小节 ---------- */
.blk{margin-top:80px}
.blk-label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:22px;font-size:var(--f5);font-weight:700;letter-spacing:.06em}
.blk-label::before{content:"";width:8px;height:8px;background:var(--red)}
.sub-title{margin:32px 0 10px;font-size:var(--f3);font-weight:800;line-height:1.4}
.report-text{max-width:880px}
.report-text+.report-text{margin-top:12px}
.sub-title+.report-text{margin-bottom:18px}
.note{margin-top:14px;font-size:var(--f5);font-weight:700;color:var(--gray)}
.report-text a,td a,.apx-body a,.card-body a{color:var(--red)}

/* 一句话逻辑：本章的红色块 */
.callout{padding:40px 44px;background:var(--red);color:#fff}
.callout-label{font-size:var(--f5);font-weight:700;letter-spacing:.08em;opacity:.85}
.callout-text{margin-top:14px;max-width:1040px;font-size:var(--f3);font-weight:700;line-height:1.65}
.callout-text b{font-weight:800;box-shadow:inset 0 -2px 0 rgba(255,255,255,.6)}
.callout a{color:#fff}

/* 问题卡片：不装框，编号由顺序生成；最后一行自动铺满，不留空洞 */
.grid-3{display:flex;flex-wrap:wrap;gap:40px 48px;counter-reset:card}
.card{flex:1 1 240px;min-width:0;counter-increment:card}
.card::before{content:counter(card,decimal-leading-zero);display:block;font-size:var(--f2);font-weight:800;line-height:1;color:var(--red)}
.pri-badge{display:block;margin-top:14px;font-size:var(--f5);font-weight:700;letter-spacing:.06em;color:var(--gray)}
.card-title{margin-top:6px;font-size:var(--f3);font-weight:800;line-height:1.4}
.card-body{margin-top:6px}

/* 专题条目 */
.rb{display:grid}
.thm{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:24px 0}
.thm+.thm{border-top:1px solid rgba(17,17,17,.1)}
.thm-k{font-size:var(--f5);font-weight:700;letter-spacing:.06em;line-height:2;color:var(--red)}
.thm-t{font-size:var(--f3);font-weight:800;line-height:1.4}
.thm-p{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:var(--f5);font-weight:700;color:var(--gray);white-space:nowrap;vertical-align:2px}
.thm-p.pri-p0,.thm-p.pri-p1{color:var(--red)}
.thm-p.pri-p0::before,.thm-p.pri-p1::before,.thm-p.pri-p2::before{content:"";width:10px;height:10px}
.thm-p.pri-p0::before{background:var(--red)}
.thm-p.pri-p1::before{box-shadow:inset 0 0 0 1.5px var(--red)}
.thm-p.pri-p2::before{box-shadow:inset 0 0 0 1.5px var(--gray)}
.thm-d{margin-top:6px}
.thm-o{margin-top:8px;font-size:var(--f5);font-weight:700;color:var(--gray)}

/* 表格：表头一行、编号不拆；宽了在自己的容器里横向滚动 */
.table-scroll,.journey-scroll{max-width:100%;overflow-x:auto}
.table-scroll:focus-visible,.journey-scroll:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.table-scroll table{min-width:720px}
table{width:100%;border-collapse:collapse}
th{padding:0 14px 10px;border-bottom:1.5px solid var(--ink);font-size:var(--f5);font-weight:700;color:var(--gray);text-align:center;vertical-align:middle;white-space:nowrap;word-break:keep-all}
td{padding:13px 14px;vertical-align:middle;text-align:left;word-break:normal;overflow-wrap:normal}
tbody tr:nth-child(odd) td{background:rgba(235,232,223,.45)}
.cell-center,.cell-id{text-align:center}
.cell-id,.cell-compact{white-space:nowrap;word-break:keep-all}
.cell-id{font-weight:800;color:var(--red)}
.req-tbl{table-layout:fixed}
.table-scroll table.req-tbl{min-width:1000px}
.table-scroll table.req-tbl.has-p{min-width:1060px}
.req-tbl th:nth-child(1){width:72px}
.req-tbl th:nth-child(3){width:170px}
.req-tbl th:nth-child(4){width:140px}
.req-tbl th:nth-child(5){width:200px}
.req-tbl.has-p th:nth-child(2){width:80px}
.req-tbl.has-p th:nth-child(3){width:auto}
.req-tbl.has-p th:nth-child(4){width:170px}
.req-tbl.has-p th:nth-child(5){width:140px}
.req-tbl.has-p th:nth-child(6){width:200px}
.req-tbl td b{font-weight:800}

/* 优先级：P0 实心、P1 红框、P2 灰框；需求可按优先级筛选 */
.pmark{display:inline-flex;align-items:center;gap:6px;font-size:var(--f5);font-weight:700;white-space:nowrap}
.pmark::before{content:"";width:10px;height:10px}
.pm0{color:var(--red)}.pm0::before{background:var(--red)}
.pm1{color:var(--red)}.pm1::before{box-shadow:inset 0 0 0 1.5px var(--red)}
.pm2{color:var(--gray)}.pm2::before{box-shadow:inset 0 0 0 1.5px var(--gray)}
.p-filter{display:none;flex-wrap:wrap;gap:24px}
.has-js .p-filter{display:flex}
.p-filter button{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 0;border:0;background:none;font-weight:800;color:var(--gray);cursor:pointer}
.p-filter button[aria-pressed="true"]{color:var(--ink)}
.p-n{font-weight:700;color:var(--gray)}
.p-filter button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--red)}
.p-legend{margin-top:10px;font-size:var(--f5);color:var(--gray)}
[hidden]{display:none!important}

/* 需求拆解：专题头用粗线和大标题，不再套色块 */
.thm-head{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;margin-top:56px;padding-top:20px;border-top:3px solid var(--ink)}
.blk>.thm-head:first-child,.blk-label+.thm-head,.blk-label+.req-theme>.thm-head{margin-top:0}
.p-legend+.req-theme>.thm-head{margin-top:32px}
.thm-hk{font-size:var(--f5);font-weight:700;letter-spacing:.06em;line-height:2;color:var(--red)}
.thm-ht{font-size:var(--f2);font-weight:800;line-height:1.2;letter-spacing:-.02em}
.thm-hd{margin-top:8px;max-width:880px;color:var(--gray)}

/* 用户旅程：今天用灰底，目标用红线 */
.jn{min-width:860px}
.jn-head,.jn-row{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) 210px}
.jn-head>div{padding:0 16px 10px 0;font-size:var(--f5);font-weight:700;letter-spacing:.06em;color:var(--gray)}
.jn-head .h-tgt{color:var(--red)}
.jn-row+.jn-row{border-top:1px solid rgba(17,17,17,.08)}
.jn-row>div{padding:16px 16px 16px 0}
.jn-step{display:flex;gap:10px;align-items:baseline}
.jn-num{font-size:var(--f3);font-weight:800;color:var(--red)}
.jn-name{font-weight:800}
.jn-row .jn-now{margin-right:12px;padding-left:14px;background:rgba(235,232,223,.6);color:var(--gray)}
.jn-row .jn-tgt{margin-right:12px;padding-left:14px;font-weight:700;box-shadow:inset 2px 0 0 var(--red)}
.jn-mx{font-size:var(--f5);color:var(--gray)}

/* 取舍原则：两列，编号做背景层次；单数时最后一条占满一行 */
.pr-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
.pr-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:20px 0;border-top:1px solid rgba(17,17,17,.08)}
.pr-item:last-child:nth-child(odd){grid-column:1 / -1}
.pr-n{font-size:var(--f2);font-weight:800;line-height:1;color:var(--light)}
.pr-h{font-size:var(--f3);font-weight:800;line-height:1.4}
.pr-b{margin-top:6px;color:var(--gray)}
.pr-b b{color:var(--ink)}

/* 版本节奏：每个阶段一个空心圆点，像时间轴上的节点 */
.rm-grid{display:grid;min-width:max-content}
.rm-head{padding:0 16px 10px 0;font-size:var(--f5);font-weight:700;letter-spacing:.06em;color:var(--gray)}
.rm-ver,.rm-cell{padding:20px 20px 20px 0;border-top:1.5px solid var(--ink)}
.rm-ver{position:relative;padding-left:30px}
.rm-ver::before{content:"";position:absolute;left:0;top:23px;width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
.rm-ver-name{font-size:var(--f3);font-weight:800;line-height:1.4}
.rm-ver-date{margin-top:2px;font-size:var(--f5);font-weight:700;color:var(--gray)}

/* 关键数字：本章的浅色块；数值是多少就画多少个小方块 */
.stats{display:flex;flex-wrap:wrap;gap:40px 56px;padding:44px 48px;background:var(--tint)}
.stat{flex:1 1 200px;min-width:0}
.stat-v{display:block;font-size:var(--f1);font-weight:800;line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stat-v.long{font-size:var(--f2);line-height:1.15;letter-spacing:-.02em}
.stat-l{margin-top:16px;font-weight:800}
.stat-t{margin-top:6px;color:var(--gray)}
.stat-marks{display:flex;flex-wrap:wrap;gap:4px;max-width:240px;margin-top:18px}
.stat-marks i{width:20px;height:8px;background:var(--red)}
.stat-dots{width:100%;max-width:220px;height:68px;margin-top:18px;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:8px 8px;opacity:.6}

/* 截图：缩略图统一比例、从顶部裁切，点开看原图 */
.figs{display:flex;flex-wrap:wrap;gap:40px 32px}
.fig{flex:1 1 300px;min-width:0}
.fig-open{display:block;width:100%;padding:0;border:0;background:none;box-shadow:0 0 0 1px var(--light);cursor:zoom-in}
.fig img{display:block;width:100%;aspect-ratio:16 / 10;object-fit:cover;object-position:top}
.fig figcaption{margin-top:12px}
.fig figcaption b{font-weight:800}
.fig figcaption span{display:block;margin-top:2px;color:var(--gray)}
.lightbox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(17,17,17,.86)}
.lightbox img{max-width:100%;max-height:100%}
.lightbox button{position:absolute;top:16px;right:20px;width:40px;height:40px;border:0;background:var(--red);font-size:var(--f3);color:#fff;cursor:pointer}

/* 折叠附录 */
.apx{border-top:1px solid rgba(17,17,17,.12)}
.apx:last-child{border-bottom:1px solid rgba(17,17,17,.12)}
.apx summary{display:flex;align-items:center;gap:12px;padding:16px 0;font-weight:800;list-style:none;cursor:pointer}
.apx summary::-webkit-details-marker{display:none}
.apx summary::before{content:"+";width:16px;font-size:var(--f3);font-weight:800;line-height:1;color:var(--red)}
.apx[open] summary::before{content:"−"}
.apx-body{padding:4px 0 28px 28px}

/* 漏斗：只用于口径核对过的真实数据 */
.funnel-step{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:center;margin-top:8px}
.funnel-label{font-weight:700;text-align:right}
.funnel-bar{display:flex;align-items:center;min-width:56px;height:40px;padding:0 14px;font-weight:800;color:#fff}
.funnel-drop{margin:4px 0 0 176px;font-size:var(--f5);font-weight:700;color:var(--red)}

/* ---------- 动效：进入画面、数字滚动、徽章慢转；减少动态效果时全部关闭 ---------- */
.js .sec-no{clip-path:inset(100% 0 0 0);transition:clip-path .9s var(--ease)}
.js .sec-head.in .sec-no{clip-path:inset(-10% 0 0 0)}
.js .stat-marks i{transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.js .stat-marks.in i{transform:none}
@media (prefers-reduced-motion:no-preference){
  .mast h1::after{animation:caret 1.1s steps(1) infinite}
  .badge g{transform-origin:75px 75px;animation:spin 40s linear infinite}
}
@keyframes caret{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){:root{--side:200px}.sec-head,.thm,.thm-head{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:1024px){:root{--f1:96px}.pr-list{grid-template-columns:minmax(0,1fr)}.pr-item:last-child:nth-child(odd){grid-column:auto}}
@media (max-width:820px){
  :root{--f1:64px;--f2:26px;--f3:17px}
  .toc{position:sticky;bottom:auto;width:auto;flex-direction:row;align-items:center;gap:16px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--light);overflow-x:auto}
  .brand span,.subs,.chapters>li.cur .subs,.toc-foot{display:none}
  .brand b{white-space:nowrap}
  .chapters{display:flex;gap:14px;margin:0}
  .chapters>li>a{display:flex;gap:4px;white-space:nowrap}
  main{margin-left:0;padding:0 16px 80px}
  .mast{padding-top:40px}
  .mast h1{max-width:none}
  .badge,.reg{display:none}
  .bg-word{top:-26px}
  .sec{margin-top:104px}
  .blk{margin-top:56px}
  .sec-head,.thm,.thm-head,.mast-row{grid-template-columns:minmax(0,1fr);gap:12px}
  .stats{padding:28px 24px}
  .callout{padding:28px 24px}
  .apx-body{padding-left:0}
  .funnel-step{grid-template-columns:96px minmax(0,1fr)}
  .funnel-drop{margin-left:112px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chapters a{transition:none}}
@media print{.toc,.lightbox,.skip,.p-filter{display:none}main{margin:0;padding:0}body{background:#fff}.inner::before,.inner::after,.bg-word,.badge,.reg{display:none}.table-scroll,.journey-scroll{overflow:visible}.table-scroll table,.table-scroll table.req-tbl{min-width:0;table-layout:auto}.req-tbl th{width:auto!important}.apx{break-inside:avoid}}
</style>
</head>
<body>
<a class="skip" href="#report">跳到正文</a>
<aside class="toc" aria-label="报告目录">
  <div class="brand"><b>__PROJECT__</b><span>__MODE__</span></div>
  <ol class="chapters">__NAV__</ol>
  <div class="toc-foot">__STATUS__ · __DATE__<br>负责人：__OWNER__</div>
</aside>
<main id="report">
<div class="inner">
<header class="mast">
  <svg class="badge" viewBox="0 0 150 150" aria-hidden="true"><defs><path id="ringpath" d="M75 75 m-56 0 a56 56 0 1 1 112 0 a56 56 0 1 1 -112 0"/></defs><g><circle cx="75" cy="75" r="70" fill="none" stroke="currentColor" stroke-width="1"/><text><textPath href="#ringpath" textLength="350" lengthAdjust="spacingAndGlyphs">__BADGE__</textPath></text></g><rect class="badge-dot" x="68" y="68" width="14" height="14"/></svg>
  <p class="kicker">PROJECT INITIATION · __MODE__</p>
  <h1>__PROJECT__</h1>
  <p class="tagline">__TAGLINE__</p>
  <div class="mast-row">
    <p>__SUBTITLE__</p>
    <dl class="facts"><dt>状态</dt><dd class="red">__STATUS__</dd><dt>日期</dt><dd>__DATE__</dd><dt>负责人</dt><dd>__OWNER__</dd></dl>
  </div>
</header>
__SECTIONS__
</div>
</main>
<div class="lightbox" id="lightbox" hidden><button type="button" aria-label="关闭">×</button><img alt=""></div>
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('has-js');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 进入画面：章节编号揭开、数字滚动、小方块依次出现；减少动态效果时不启用
  function countUp(el) {
    var to = +el.dataset.count, start = null;
    function step(t) {
      if (start === null) start = t;
      var k = Math.min((t - start) / 1200, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var counters = document.querySelectorAll('.stat-v[data-count]');
  if (!reduce && 'IntersectionObserver' in window) {
    root.classList.add('js');
    counters.forEach(function (el) { el.textContent = '0'; });
    window.addEventListener('beforeprint', function () { counters.forEach(function (el) { el.textContent = el.dataset.count; }); });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        if (e.target.dataset.count) countUp(e.target);
        io.unobserve(e.target);
      });
    }, { threshold: 0.3 });
    document.querySelectorAll('[data-anim], .stat-marks').forEach(function (el) { io.observe(el); });
    counters.forEach(function (el) { io.observe(el); });
  }

  // 需求按优先级筛选：每个需求组件各管各的
  document.querySelectorAll('.p-filter').forEach(function (bar) {
    var scope = bar.parentElement;
    var buttons = Array.prototype.slice.call(bar.querySelectorAll('button'));
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.dataset.p;
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
        scope.querySelectorAll('tr[data-p]').forEach(function (tr) { tr.hidden = p !== 'all' && tr.dataset.p !== p; });
        scope.querySelectorAll('.req-task').forEach(function (task) { task.hidden = !task.querySelector('tr[data-p]:not([hidden])'); });
        scope.querySelectorAll('.req-theme').forEach(function (theme) { theme.hidden = !theme.querySelector('.req-task:not([hidden])'); });
      });
    });
  });

  // 截图放大
  var box = document.getElementById('lightbox');
  var big = box.querySelector('img');
  var closeBtn = box.querySelector('button');
  var opener = null;
  document.querySelectorAll('.fig-open').forEach(function (b) {
    b.addEventListener('click', function () {
      var img = b.querySelector('img');
      opener = b;
      big.src = img.src;
      big.alt = img.alt;
      box.hidden = false;
      closeBtn.focus();
    });
  });
  function close() {
    box.hidden = true;
    big.removeAttribute('src');
    if (opener) opener.focus();
  }
  closeBtn.addEventListener('click', close);
  box.addEventListener('click', function (e) { if (e.target === box) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) close(); });

  // 目录：当前章展开小节，当前小节加粗
  var chapters = Array.prototype.slice.call(document.querySelectorAll('.chapters > li'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('main section.sec'));
  var subLinks = Array.prototype.slice.call(document.querySelectorAll('.subs a'));
  function spy() {
    var line = window.innerHeight * 0.35, cur = 0;
    sections.forEach(function (s, i) { if (s.getBoundingClientRect().top < line) cur = i; });
    var bottom = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
    if (bottom <= 2) cur = sections.length - 1;
    chapters.forEach(function (li, i) {
      li.classList.toggle('cur', i === cur);
      var a = li.querySelector(':scope > a');
      if (i === cur) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
    });
    var active = null;
    if (chapters[cur]) chapters[cur].querySelectorAll('.subs a').forEach(function (a) {
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target && target.getBoundingClientRect().top < line) active = a;
    });
    subLinks.forEach(function (a) { a.classList.toggle('on', a === active); });
  }
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', spy);
  spy();
})();
</script>
</body>
</html>
